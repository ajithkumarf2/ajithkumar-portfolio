name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/ai/requirements.txt

      - name: Install Frontend Dependencies & Build
        run: |
          cd client
          npm ci || npm install
          npm run build

      - name: Install Backend Dependencies & Test
        run: |
          cd server
          npm ci || npm install
          node src/tests/test_api.js
